# Probe record for llms.txt across every Pynt host.
#
# roadmap#27: `llms_txt_published` credited a DECLARED pointer wherever no llms/
# artifact existed. This file is the measurement behind the pointer.
#
# 2026-08-27 UPDATE: a REAL llms.txt was found on the DOCS host. The previously
# recorded www.pynt.io/llms.txt remains a non-llms plain-text marketing dump; the
# docs host serves a properly structured llms.txt (H1 + section + 139 linked
# markdown docs). The artifact llms/pynt-llms.txt is the docs host body, saved
# verbatim.
llms:
  probed: '2026-08-27'
  url: https://docs.pynt.io/llms.txt
  verdict: llms-txt
  published: true
  http_status: 200
  content_type: text/markdown; charset=utf-8
  bytes: 37907
  file: pynt-llms.txt
  links: 139
  note: >-
    Structured llms.txt: "# Documentation" heading, "## Documentation" section,
    139 markdown-linked doc pages. GitBook also serves a .md twin of every doc
    page (append .md to any docs URL), which the file advertises.
probes:
  - url: https://docs.pynt.io/llms.txt
    http_status: 200
    content_type: text/markdown; charset=utf-8
    bytes: 37907
    verdict: llms-txt
  - url: https://www.pynt.io/llms.txt
    http_status: 200
    content_type: text/plain; charset=utf-8
    bytes: 12529
    verdict: not-llms
    note: >-
      Fetched, but the body carries no llms.txt structure (no '#' or '>'
      headings) — it is a prose marketing dump prefixed with a sitemap line.
  - url: https://api.pynt.io/llms.txt
    http_status: 404
    verdict: absent
  - url: https://app.pynt.io/llms.txt
    http_status: 200
    verdict: spa-shell
    note: SPA catch-all returns the same index.html for every path; not a document.
