modified: '2026-08-27'
generated: '2026-08-27'
method: searched
source: >-
  https://www.pynt.io/ (homepage CTAs), https://www.pynt.io/sitemap.xml, plus
  direct probes of every plausible pricing path
plan_count: 0
tags:
  - API Testing
  - Platform
  - Security
description: >-
  Pynt publishes NO pricing page and NO named plan tiers. The go-to-market is
  free-entry plus demo-gated commercial: the site offers "Start Free" (a free
  API pentest / free tier reached through the Postman, Burp and Selenium
  integrations) and "Get a Demo", with commercial terms negotiated privately.
  This file records that absence deliberately — plan_count: 0 is the finding.
plans: []
probes:
  - url: https://www.pynt.io/pricing
    status: 200
    result: redirect-to-home
    note: Resolves to https://www.pynt.io/ — there is no pricing page behind this path.
  - url: https://www.pynt.io/pricing/
    status: 200
    result: redirect-to-home
  - url: https://www.pynt.io/plans
    status: 404
  - url: https://www.pynt.io/pricing-plans
    status: 404
  - url: https://www.pynt.io/sitemap.xml
    status: 200
    result: no-pricing-entry
    note: >-
      The sitemap lists 36 non-blog pages. None is a pricing or plans page. The
      commercial entry points present are /book-a-demo,
      /get-free-api-pentest, /partnerships and /referrals.
commercial_entry_points:
  - name: Start Free / Free API pentest
    url: https://www.pynt.io/get-free-api-pentest
    http_status: 200
    price: '0.00'
    note: >-
      Free entry, no published quota, no published limit. Pynt describes itself
      as a free API security testing solution and lets users start through the
      Postman / Burp / Selenium integrations without a contract.
  - name: Get a Demo
    url: https://www.pynt.io/book-a-demo
    http_status: 200
    price: custom
    note: Sales-gated commercial motion. No list price is published anywhere.
  - name: AWS Marketplace
    price: unknown
    note: >-
      The API contract carries an aws-marketplace tag with two operations
      (POST /v1/marketplace/aws/register and POST /v1/marketplace/aws/signup),
      which means Pynt transacts through AWS
      Marketplace. No public listing price was captured in this pass; a
      Marketplace listing would be the only place a published price exists.
    evidence: openapi/pynt-openapi.json — tag "aws-marketplace", 2 operations
previous_state:
  note: >-
    This file previously held a three-tier Free/Professional/Enterprise scaffold
    with invented quotas (1,000 and 100,000 requests/month) written by the
    2026-05-04 bulk sweep, method: generated. Pynt publishes none of that. The
    scaffold has been removed rather than left to be read as provider-published
    pricing.
