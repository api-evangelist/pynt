specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Pynt
providerId: pynt
created: '2026-05-04'
modified: '2026-08-27'
generated: '2026-08-27'
method: probed
source: >-
  live unauthenticated responses from https://api.pynt.io/v1/* on 2026-08-27,
  plus a documentation search of docs.pynt.io and the OpenAPI at
  https://api.pynt.io/openapi.json
limit_count: 0
tags:
  - API Testing
  - Platform
  - Security
  - Rate Limiting
description: >-
  Pynt publishes no API rate limits. This is an honest zero, recorded from
  direct observation: no rate-limit response header was returned on any live
  request, no 429 response is declared on any of the 134 operations in the
  contract, and no throttling, quota or fair-use page exists on docs.pynt.io.
limits: []
headers:
  observed: []
  note: >-
    Response headers returned by api.pynt.io on GET /v1/auth/check,
    GET /v1/application and GET /v1/scan/summary (all HTTP 401) were exactly:
    date, content-type, content-length, server (uvicorn). No RateLimit-*, no
    X-RateLimit-*, no Retry-After.
responseCodes:
  throttled: unknown
  note: >-
    No 429 appears anywhere in openapi/pynt-openapi.json. The only declared
    error status across the whole contract is 422 (validation). An agent hitting
    a limit has no documented signal to back off on.
probes:
  - url: https://api.pynt.io/v1/auth/check
    status: 401
    rate_limit_headers: none
    fetched: '2026-08-27'
  - url: https://api.pynt.io/v1/application
    status: 401
    rate_limit_headers: none
    fetched: '2026-08-27'
  - url: https://api.pynt.io/v1/scan/summary
    status: 401
    rate_limit_headers: none
    fetched: '2026-08-27'
documentation:
  published: false
  searched:
    - https://docs.pynt.io/llms.txt
    - https://docs.pynt.io/documentation
  note: >-
    The 139-entry docs index carries no rate limit, quota or throttling page.
    The only "rate limiting" content on the docs site is a SECURITY TEST Pynt
    performs against its customers' APIs ("Lack of Resources and Rate
    Limiting") — not a limit on Pynt's own API. Do not confuse the two.
previous_state:
  note: >-
    This file previously carried invented per-tier limits (10/100/1000 rpm,
    1k/100k monthly quotas) and a full header set written by the 2026-05-04 bulk
    sweep, method: generated. None of it was published by Pynt. Replaced with
    the probed zero.
