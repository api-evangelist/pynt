aid: pynt
name: Pynt
description: >-
  Pynt is an API security testing platform that discovers and secures APIs, LLM
  endpoints and MCP servers. It wraps a team's existing functional tests — or
  proxies live traffic — and runs automated attack simulations against whatever
  API surface it observes, covering business-logic flaws, injection, mass
  assignment, authentication bypass, SSRF, GraphQL introspection and alias
  overloading, LLM prompt injection and sensitive-data exposure. Pynt builds an
  API catalog from Swagger/OpenAPI definitions, Postman collections, API
  gateways, code repositories and eBPF live-traffic capture, scores each
  endpoint for risk, applies LLM false-positive and business-impact analysis to
  its findings, and generates automated penetration-test reports. It is
  delivered as a Python CLI that manages a Docker container, with integrations
  across Postman, Burp Suite, Insomnia, ReadyAPI, a dozen test frameworks, and
  the major CI/CD platforms. Pynt exposes a public REST API at api.pynt.io.
