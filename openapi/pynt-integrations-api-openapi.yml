openapi: 3.2.0
info:
  title: Pynt Integrations API
  version: 0.1.0
tags:
- name: Integrations
paths:
  /v1/integrations:
    get:
      tags:
      - Integrations
      summary: List Integrations
      operationId: list_integrations_v1_integrations_get
      security:
      - API Key: []
      - Bearer Token: []
      - System API Key: []
      - Organization ID: []
      - Operator Organization Context: []
      parameters:
      - name: filter
        in: query
        required: false
        schema:
          type: string
          title: Filter
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListIntegrationsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ListIntegrationsResponse:
      properties:
        integrations:
          items:
            $ref: '#/components/schemas/IntegrationInfo'
          type: array
          title: Integrations
      type: object
      required:
      - integrations
      title: ListIntegrationsResponse
    IntegrationInfo:
      properties:
        integration_id:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          title: Integration Id
        integration_type:
          type: string
          title: Integration Type
        status:
          type: string
          title: Status
      type: object
      required:
      - integration_id
      - integration_type
      - status
      title: IntegrationInfo
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    API_Key:
      type: apiKey
      in: header
      name: X-API-Key
    Bearer_Token:
      type: apiKey
      in: header
      name: Authorization
    System_API_Key:
      type: apiKey
      in: header
      name: X-System-API-Key
    Organization_ID:
      type: apiKey
      in: header
      name: X-Organization-ID
    Operator_Organization_Context:
      type: apiKey
      in: header
      name: context
