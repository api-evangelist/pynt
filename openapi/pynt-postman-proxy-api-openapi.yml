openapi: 3.2.0
info:
  title: Pynt Postman Proxy API
  version: 0.1.0
tags:
- name: postman-proxy
paths:
  /v1/postman-proxy/{_path_name}:
    post:
      tags:
      - postman-proxy
      summary: Postman Proxy
      operationId: postman_proxy_v1_postman_proxy___path_name__post
      parameters:
      - name: _path_name
        in: path
        required: true
        schema:
          type: string
          title: ' Path Name'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Postman Proxy V1 Postman Proxy   Path Name  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
