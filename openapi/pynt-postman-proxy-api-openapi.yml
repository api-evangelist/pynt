                title: Response Postman Proxy V1 Postman Proxy   Path Name  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - postman-proxy
      summary: Postman Proxy
      operationId: postman_proxy_v1_postman_proxy___path_name__post
      parameters:
      - name: _path_name
        in: path
        required: true
        schema:
          type: string
          title: ' Path Name'
      responses:
        '200':
          description: Successful Response
